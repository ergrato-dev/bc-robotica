<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-label="Bootcamp Robótica Zero to Hero">
  <title>Bootcamp Robótica Zero to Hero</title>
  <!-- Background -->
  <rect width="800" height="200" fill="#0d1117"/>

  <!-- Side accent bars -->
  <rect x="0" y="0" width="8" height="200" fill="#4b8bbe"/>
  <rect x="792" y="0" width="8" height="200" fill="#00599c"/>

  <!-- Top / bottom accent lines -->
  <rect x="50" y="20" width="700" height="2" fill="#4b8bbe" opacity="0.5"/>
  <rect x="50" y="178" width="700" height="2" fill="#00599c" opacity="0.5"/>

  <!-- Robot head icon -->
  <g transform="translate(60, 55)">
    <rect x="0" y="14" width="70" height="60" rx="10" fill="#161b22" stroke="#4b8bbe" stroke-width="3"/>
    <circle cx="20" cy="40" r="7" fill="#4b8bbe"/>
    <circle cx="50" cy="40" r="7" fill="#00599c"/>
    <rect x="18" y="56" width="34" height="6" rx="3" fill="#79c0ff"/>
    <line x1="35" y1="14" x2="35" y2="0" stroke="#8b949e" stroke-width="3"/>
    <circle cx="35" cy="0" r="5" fill="#3fb950"/>
    <rect x="-10" y="28" width="10" height="20" rx="4" fill="#161b22" stroke="#4b8bbe" stroke-width="2"/>
    <rect x="70" y="28" width="10" height="20" rx="4" fill="#161b22" stroke="#00599c" stroke-width="2"/>
  </g>

  <!-- Main Title -->
  <text x="180" y="85" font-family="Inter, Roboto, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#e6edf3">
    Bootcamp Robótica
  </text>

  <!-- Subtitle -->
  <text x="180" y="120" font-family="Inter, Roboto, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#4b8bbe">
    Zero to Hero
  </text>

  <!-- Tagline -->
  <text x="180" y="155" font-family="Inter, Roboto, -apple-system, sans-serif" font-size="14" font-weight="300" fill="#8b949e">
    ROS2 · Python + C++ · Simulación primero · 19 semanas
  </text>

  <!-- Right side decorative code snippet -->
  <g transform="translate(560, 45)" opacity="0.55">
    <text font-family="monospace" font-size="11" fill="#4b8bbe">
      <tspan x="0" y="0">rclpy.spin(node)</tspan>
      <tspan x="0" y="18" fill="#00599c">rclcpp::spin(node);</tspan>
      <tspan x="0" y="36" fill="#79c0ff">ros2 launch bringup.py</tspan>
      <tspan x="0" y="54" fill="#a371f7">gz sim -s -r world.sdf</tspan>
    </text>
  </g>
</svg>
