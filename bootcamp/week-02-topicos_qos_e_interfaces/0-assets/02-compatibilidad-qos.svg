<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-label="Matrices de compatibilidad QoS. Reliability: solo publisher BEST_EFFORT con subscriber RELIABLE es incompatible. Durability: solo publisher VOLATILE con subscriber TRANSIENT_LOCAL es incompatible">
  <title>Compatibilidad QoS: pedido contra ofrecido</title>
  <rect width="840" height="360" fill="#0d1117"/>
  <text x="420" y="36" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Lo que el publisher ofrece debe ser igual o mejor que lo que el subscriber pide</text>

  <!-- Reliability matrix -->
  <text x="210" y="80" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Reliability</text>
  <text x="250" y="110" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="12" fill="#8b949e">subscriber pide</text>
  <text x="190" y="134" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#79c0ff">RELIABLE</text>
  <text x="310" y="134" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#79c0ff">BEST_EFFORT</text>
  <text x="40" y="128" font-family="Inter, Roboto, sans-serif" font-size="12" fill="#8b949e">publisher</text>
  <text x="40" y="144" font-family="Inter, Roboto, sans-serif" font-size="12" fill="#8b949e">ofrece</text>
  <text x="40" y="190" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#79c0ff">RELIABLE</text>
  <text x="40" y="270" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#79c0ff">BEST_EFFORT</text>
  <rect x="135" y="150" width="110" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="190" y="191" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="15" fill="#3fb950">conecta</text>
  <rect x="255" y="150" width="110" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="310" y="191" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="15" fill="#3fb950">conecta</text>
  <rect x="135" y="230" width="110" height="70" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="190" y="262" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="15" font-weight="700" fill="#f85149">NO</text>
  <text x="190" y="282" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="11" fill="#8b949e">pide reintentos</text>
  <rect x="255" y="230" width="110" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="310" y="271" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="15" fill="#3fb950">conecta</text>

  <!-- Durability matrix -->
  <text x="630" y="80" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Durability</text>
  <text x="670" y="110" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="12" fill="#8b949e">subscriber pide</text>
  <text x="610" y="134" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#79c0ff">TRANSIENT_LOCAL</text>
  <text x="730" y="134" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#79c0ff">VOLATILE</text>
  <text x="440" y="190" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#79c0ff">TRANSIENT_LOCAL</text>
  <text x="440" y="270" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#79c0ff">VOLATILE</text>
  <rect x="555" y="150" width="110" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="610" y="182" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="15" fill="#3fb950">conecta</text>
  <text x="610" y="202" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="11" fill="#8b949e">recibe historial</text>
  <rect x="675" y="150" width="110" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="730" y="182" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="15" fill="#3fb950">conecta</text>
  <text x="730" y="202" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="11" fill="#8b949e">sin historial</text>
  <rect x="555" y="230" width="110" height="70" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="610" y="262" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="15" font-weight="700" fill="#f85149">NO</text>
  <text x="610" y="282" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="11" fill="#8b949e">pide historial</text>
  <rect x="675" y="230" width="110" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="730" y="271" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="15" fill="#3fb950">conecta</text>

  <text x="420" y="338" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="13" fill="#8b949e">Incompatible = sin error: el callback no se ejecuta y solo queda un [WARN] en el log</text>
</svg>
