# Configuración de mypy para este paquete.
[mypy]
python_version = 3.12
# strict activa todos los chequeos opcionales: funciones sin tipos, Any
# implícitos, returns que faltan...
strict = True
# Los paquetes de mensajes (std_msgs...) no traen información de tipos.
# Sin esto, cada import suyo sería un error.
ignore_missing_imports = True
# rclpy trae tipos solo en parte: sin esto, cada llamada a get_logger() o
# destroy_node() sería un error. Tu código sigue revisado en modo estricto.
disallow_untyped_calls = False

# rclpy reexporta try_shutdown sin declararlo; esto lo acepta.
[mypy-rclpy]
implicit_reexport = True
