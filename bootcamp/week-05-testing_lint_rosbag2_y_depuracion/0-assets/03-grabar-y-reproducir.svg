<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" role="img" aria-label="Grabar y reproducir con rosbag2. Al grabar, range_sim publica en /robot/range_raw_m y ros2 bag record guarda cada mensaje en la carpeta rango_crudo, con un archivo .mcap y metadata.yaml. Al reproducir, ros2 bag play publica de nuevo esos mensajes en /robot/range_raw_m con sus tiempos originales, y range_filter los procesa como si vinieran del sensor. Además, un test puede leer la bag directamente con rosbag2_py o rosbag2_cpp, sin ningún nodo en marcha">
  <title>Grabar y reproducir con rosbag2</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
  <rect width="860" height="420" fill="#0d1117"/>
  <text x="430" y="34" text-anchor="middle" font-family="Inter, Roboto, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Una bag: grabar una vez, reproducir siempre</text>
  <g font-family="Inter, Roboto, &quot;Segoe UI&quot;, system-ui, sans-serif">
  <text x="20" y="80" font-size="14" font-weight="700" fill="#8b949e">Grabar</text>
<rect x="20" y="92" width="150" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="95" y="125" text-anchor="middle" font-size="13" fill="#e6edf3" >range_sim</text>
<rect x="210" y="92" width="190" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="305" y="125" text-anchor="middle" font-size="13" fill="#e6edf3" font-family="ui-monospace, &quot;JetBrains Mono&quot;, Consolas, monospace">/robot/range_raw_m</text>
<rect x="440" y="92" width="170" height="56" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="525" y="125" text-anchor="middle" font-size="13" fill="#e6edf3" font-family="ui-monospace, &quot;JetBrains Mono&quot;, Consolas, monospace">ros2 bag record</text>
  <rect x="650" y="80" width="190" height="200" rx="10" fill="#21262d" stroke="#d29922" stroke-width="2"/>
  <text x="745" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">rango_crudo/</text>
  <text x="745" y="134" text-anchor="middle" font-size="12" fill="#79c0ff" font-family="ui-monospace, &quot;JetBrains Mono&quot;, Consolas, monospace">rango_crudo_0.mcap</text>
  <text x="745" y="154" text-anchor="middle" font-size="12" fill="#8b949e">mensajes + tiempos</text>
  <text x="745" y="184" text-anchor="middle" font-size="12" fill="#79c0ff" font-family="ui-monospace, &quot;JetBrains Mono&quot;, Consolas, monospace">metadata.yaml</text>
  <text x="745" y="204" text-anchor="middle" font-size="12" fill="#8b949e">topics, tipos, QoS,</text>
  <text x="745" y="220" text-anchor="middle" font-size="12" fill="#8b949e">duración, cuántos</text>
  <text x="20" y="200" font-size="14" font-weight="700" fill="#8b949e">Reproducir</text>
<rect x="440" y="212" width="170" height="56" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="525" y="245" text-anchor="middle" font-size="13" fill="#e6edf3" font-family="ui-monospace, &quot;JetBrains Mono&quot;, Consolas, monospace">ros2 bag play</text>
<rect x="210" y="212" width="190" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="305" y="245" text-anchor="middle" font-size="13" fill="#e6edf3" font-family="ui-monospace, &quot;JetBrains Mono&quot;, Consolas, monospace">/robot/range_raw_m</text>
<rect x="20" y="212" width="150" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="95" y="245" text-anchor="middle" font-size="13" fill="#e6edf3" >range_filter</text>
  <text x="20" y="320" font-size="14" font-weight="700" fill="#8b949e">Leer en un test</text>
<rect x="440" y="332" width="170" height="56" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/><text x="525" y="365" text-anchor="middle" font-size="13" fill="#e6edf3" font-family="ui-monospace, &quot;JetBrains Mono&quot;, Consolas, monospace">SequentialReader</text>
<rect x="210" y="332" width="190" height="56" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="305" y="365" text-anchor="middle" font-size="13" fill="#e6edf3" >test (pytest / gtest)</text>
  <text x="525" y="408" text-anchor="middle" font-size="12" fill="#8b949e">sin nodos en marcha</text>
  </g>
  <g stroke="#8b949e" stroke-width="2" fill="none">
    <path d="M170 120 L207 120" marker-end="url(#a)"/><path d="M400 120 L437 120" marker-end="url(#a)"/><path d="M610 120 L647 120" marker-end="url(#a)"/>
    <path d="M647 240 L613 240" marker-end="url(#a)"/><path d="M440 240 L403 240" marker-end="url(#a)"/><path d="M210 240 L173 240" marker-end="url(#a)"/>
    <path d="M745 280 L745 360 L613 360" marker-end="url(#a)"/><path d="M440 360 L403 360" marker-end="url(#a)"/>
  </g>
</svg>
