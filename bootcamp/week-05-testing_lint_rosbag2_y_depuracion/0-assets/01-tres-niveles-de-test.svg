<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" aria-label="Tres niveles de test. Unitario: una función sin ROS, con pytest o gtest, en milisegundos. Integración: nodos reales como procesos, con launch_testing, en segundos. Sistema: el robot completo en simulación con Gazebo, desde la Semana 08, en minutos. Cuanto más arriba, más rápido y más preciso señala el fallo; cuanto más abajo, más realista">
  <title>Tres niveles de test</title>
  <rect width="860" height="380" fill="#0d1117"/>
  <text x="430" y="34" text-anchor="middle" font-family="Inter, Roboto, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Tres niveles de test en ROS2</text>
  <g font-family="Inter, Roboto, &quot;Segoe UI&quot;, system-ui, sans-serif">
    <rect x="40" y="62" width="660" height="86" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="60" y="92" font-size="16" font-weight="700" fill="#e6edf3">Unitario</text>
    <text x="60" y="116" font-size="13" fill="#8b949e">Una función, sin ROS en marcha. Se ejecuta en milisegundos.</text>
    <text x="60" y="137" font-size="13" fill="#79c0ff" font-family="ui-monospace, &quot;JetBrains Mono&quot;, Consolas, monospace">pytest · gtest</text>
    <text x="680" y="92" text-anchor="end" font-size="12" fill="#8b949e">Ej. 01 y 02, Paso 1</text>
    <rect x="40" y="164" width="660" height="86" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="60" y="194" font-size="16" font-weight="700" fill="#e6edf3">Integración</text>
    <text x="60" y="218" font-size="13" fill="#8b949e">Nodos reales como procesos, hablando por topics. Segundos.</text>
    <text x="60" y="239" font-size="13" fill="#79c0ff" font-family="ui-monospace, &quot;JetBrains Mono&quot;, Consolas, monospace">launch_testing</text>
    <text x="680" y="194" text-anchor="end" font-size="12" fill="#8b949e">Ej. 01 Paso 2, Ej. 04, proyecto</text>
    <rect x="40" y="266" width="660" height="86" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
    <text x="60" y="296" font-size="16" font-weight="700" fill="#e6edf3">Sistema</text>
    <text x="60" y="320" font-size="13" fill="#8b949e">El robot completo en simulación. Minutos.</text>
    <text x="60" y="341" font-size="13" fill="#79c0ff" font-family="ui-monospace, &quot;JetBrains Mono&quot;, Consolas, monospace">Gazebo + verificar-simulaciones.sh</text>
    <text x="680" y="296" text-anchor="end" font-size="12" fill="#a371f7">desde la Semana 08</text>
  </g>
  <g font-family="Inter, Roboto, &quot;Segoe UI&quot;, system-ui, sans-serif" font-size="13" text-anchor="middle">
    <path d="M770 340 L770 76" stroke="#8b949e" stroke-width="2"/><path d="M762 86 L770 70 L778 86 z" fill="#8b949e"/>
    <text x="790" y="110" fill="#e6edf3" transform="rotate(90 790 110)" text-anchor="start">más rápido, señala la línea exacta</text>
    <text x="750" y="340" fill="#8b949e" transform="rotate(-90 750 340)" text-anchor="start">más realista</text>
  </g>
</svg>
