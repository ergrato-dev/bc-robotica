<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-label="Grafo computacional de ROS2: dos nodos conectados por un topic mediante DDS">
  <title>Grafo computacional de ROS2</title>
  <rect width="840" height="420" fill="#0d1117"/>

  <!-- Nodo publisher -->
  <rect x="60" y="140" width="220" height="120" rx="12" fill="#161b22" stroke="#4b8bbe" stroke-width="2"/>
  <text x="170" y="185" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#e6edf3">/sensor_publisher</text>
  <text x="170" y="212" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#8b949e">rclpy.Node</text>
  <text x="170" y="234" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#4b8bbe">create_publisher()</text>

  <!-- Nodo subscriber -->
  <rect x="560" y="140" width="220" height="120" rx="12" fill="#161b22" stroke="#00599c" stroke-width="2"/>
  <text x="670" y="185" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#e6edf3">/sensor_listener</text>
  <text x="670" y="212" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#8b949e">rclcpp::Node</text>
  <text x="670" y="234" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#00599c">create_subscription()</text>

  <!-- Topic en el medio -->
  <rect x="330" y="170" width="180" height="60" rx="10" fill="#21262d" stroke="#79c0ff" stroke-width="2"/>
  <text x="420" y="195" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#79c0ff">/sensor/state</text>
  <text x="420" y="215" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#8b949e">std_msgs/String</text>

  <!-- Flechas -->
  <line x1="280" y1="200" x2="330" y2="200" stroke="#4b8bbe" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="510" y1="200" x2="560" y2="200" stroke="#00599c" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#79c0ff"/>
    </marker>
  </defs>

  <!-- DDS layer -->
  <rect x="60" y="300" width="720" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="420" y="330" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#8b949e">Transporte DDS (Data Distribution Service)</text>
  <text x="420" y="352" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#484f58">descubrimiento automático · publish/subscribe · sin nodo maestro central</text>

  <line x1="170" y1="260" x2="170" y2="300" stroke="#30363d" stroke-width="2"/>
  <line x1="670" y1="260" x2="670" y2="300" stroke="#30363d" stroke-width="2"/>

  <!-- Caption -->
  <text x="420" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#e6edf3">Dos nodos, dos lenguajes, un mismo topic</text>
  <text x="420" y="62" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#8b949e">rclpy y rclcpp hablan el mismo protocolo DDS — ninguno sabe en qué lenguaje está el otro</text>
</svg>
