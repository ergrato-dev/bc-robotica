<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" role="img" aria-label="Flujo de colcon build: src con paquetes Python y C++ genera build, install y log">
  <title>Flujo de colcon build</title>
  <rect width="840" height="380" fill="#0d1117"/>

  <!-- src/ -->
  <rect x="40" y="40" width="220" height="140" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="150" y="65" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#e6edf3">src/</text>

  <rect x="60" y="80" width="180" height="34" rx="6" fill="#21262d" stroke="#4b8bbe" stroke-width="2"/>
  <text x="150" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#4b8bbe">paquete_python/</text>
  <text x="150" y="128" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#8b949e">ament_python</text>

  <rect x="60" y="138" width="180" height="34" rx="6" fill="#21262d" stroke="#00599c" stroke-width="2"/>
  <text x="150" y="160" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#79c0ff">paquete_cpp/</text>
  <text x="150" y="120" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#8b949e"></text>

  <!-- colcon build -->
  <rect x="340" y="90" width="160" height="60" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="420" y="115" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#3fb950">colcon build</text>
  <text x="420" y="135" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#8b949e">--symlink-install</text>

  <line x1="260" y1="97" x2="340" y2="110" stroke="#4b8bbe" stroke-width="2" marker-end="url(#arrowY)"/>
  <line x1="260" y1="155" x2="340" y2="130" stroke="#00599c" stroke-width="2" marker-end="url(#arrowY)"/>

  <!-- salidas -->
  <rect x="580" y="20" width="220" height="50" rx="8" fill="#21262d" stroke="#30363d" stroke-width="2"/>
  <text x="690" y="50" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#8b949e">build/ (intermedio)</text>

  <rect x="580" y="85" width="220" height="50" rx="8" fill="#21262d" stroke="#79c0ff" stroke-width="2"/>
  <text x="690" y="115" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#79c0ff">install/ (listo para usar)</text>

  <rect x="580" y="150" width="220" height="50" rx="8" fill="#21262d" stroke="#30363d" stroke-width="2"/>
  <text x="690" y="180" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#8b949e">log/ (por build)</text>

  <line x1="500" y1="100" x2="580" y2="45" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowY)"/>
  <line x1="500" y1="115" x2="580" y2="110" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowY)"/>
  <line x1="500" y1="140" x2="580" y2="175" stroke="#3fb950" stroke-width="2" marker-end="url(#arrowY)"/>

  <!-- activar -->
  <rect x="580" y="240" width="220" height="50" rx="8" fill="#161b22" stroke="#79c0ff" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="690" y="270" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" fill="#79c0ff">source install/setup.bash</text>
  <line x1="690" y1="135" x2="690" y2="240" stroke="#79c0ff" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowY)"/>

  <defs>
    <marker id="arrowY" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#79c0ff"/>
    </marker>
  </defs>

  <text x="420" y="330" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#8b949e">colcon compila ambos tipos de paquete en un mismo workspace, sin importar el lenguaje</text>
</svg>
