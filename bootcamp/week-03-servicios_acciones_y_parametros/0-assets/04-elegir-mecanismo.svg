<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" role="img" aria-label="Árbol de decisión. ¿Es configuración del nodo? Parámetro. Si no, ¿es un flujo continuo de datos? Topic. Si no, ¿tarda más de un segundo o hay que poder cancelarla? Acción. Si no, servicio">
  <title>Topic, servicio, acción o parámetro</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
  <rect width="840" height="380" fill="#0d1117"/>
  <text x="420" y="32" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Tres preguntas para elegir el mecanismo</text>
  <g font-family="Inter, Roboto, sans-serif" font-size="14" fill="#e6edf3" text-anchor="middle">
    <rect x="40" y="60" width="300" height="56" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="190" y="93">¿Es configuración del nodo?</text>
    <rect x="40" y="160" width="300" height="56" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="190" y="193">¿Es un flujo continuo de datos?</text>
    <rect x="40" y="260" width="300" height="70" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
    <text x="190" y="290">¿Tarda más de un segundo</text>
    <text x="190" y="310">o hay que poder cancelarla?</text>
  </g>
  <g font-family="Inter, Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <rect x="520" y="60" width="260" height="56" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="650" y="86" fill="#d29922">Parámetro</text>
    <rect x="520" y="160" width="260" height="56" rx="8" fill="#161b22" stroke="#79c0ff" stroke-width="2"/>
    <text x="650" y="186" fill="#79c0ff">Topic</text>
    <rect x="520" y="250" width="260" height="46" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
    <text x="650" y="279" fill="#bc8cff">Acción</text>
    <rect x="520" y="306" width="260" height="46" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="650" y="335" fill="#3fb950">Servicio</text>
  </g>
  <g font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#8b949e" text-anchor="middle">
    <text x="650" y="105">period_s, robot_name</text>
    <text x="650" y="205">sensor/range, dominio/state</text>
  </g>
  <g stroke="#8b949e" stroke-width="2" marker-end="url(#a)">
    <line x1="342" y1="88" x2="516" y2="88"/><line x1="342" y1="188" x2="516" y2="188"/>
    <line x1="342" y1="280" x2="516" y2="273"/><line x1="342" y1="310" x2="516" y2="329"/>
    <line x1="190" y1="118" x2="190" y2="156"/><line x1="190" y1="218" x2="190" y2="256"/>
  </g>
  <g font-family="Inter, Roboto, sans-serif" font-size="12" fill="#8b949e">
    <text x="420" y="80" text-anchor="middle">sí</text><text x="420" y="180" text-anchor="middle">sí</text>
    <text x="420" y="268" text-anchor="middle">sí</text><text x="420" y="334" text-anchor="middle">no</text>
    <text x="200" y="142">no</text><text x="200" y="242">no</text>
  </g>
</svg>
