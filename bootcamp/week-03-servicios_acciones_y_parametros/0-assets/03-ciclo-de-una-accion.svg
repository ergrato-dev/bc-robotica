<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" role="img" aria-label="Ciclo de una acción. El cliente envía el goal y el server lo acepta o lo rechaza. Si lo acepta, publica feedback varias veces y al final devuelve el result con un estado SUCCEEDED, CANCELED o ABORTED. En cualquier momento el cliente puede pedir cancelar">
  <title>Ciclo de una acción</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker></defs>
  <rect width="840" height="420" fill="#0d1117"/>
  <text x="420" y="32" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">Goal, feedback y result: tres pasos y una salida de emergencia</text>
  <rect x="90" y="52" width="200" height="44" rx="8" fill="#161b22" stroke="#79c0ff" stroke-width="2"/>
  <text x="190" y="80" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Action client</text>
  <rect x="550" y="52" width="200" height="44" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="650" y="80" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Action server</text>
  <line x1="190" y1="96" x2="190" y2="400" stroke="#30363d" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="650" y1="96" x2="650" y2="400" stroke="#30363d" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="190" y1="130" x2="645" y2="130" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="420" y="122" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="13" fill="#e6edf3">1. goal <tspan font-family="ui-monospace, Consolas, monospace" fill="#79c0ff">{distance_m: 5.0}</tspan></text>
  <line x1="650" y1="168" x2="195" y2="168" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="420" y="160" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="13" fill="#e6edf3">2. aceptado <tspan fill="#8b949e">(o rechazado: fin)</tspan></text>
  <g stroke="#d29922" stroke-width="2" marker-end="url(#a)"><line x1="650" y1="205" x2="195" y2="205"/><line x1="650" y1="235" x2="195" y2="235"/><line x1="650" y1="265" x2="195" y2="265"/></g>
  <text x="420" y="198" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="13" fill="#d29922">3. feedback <tspan font-family="ui-monospace, Consolas, monospace">{remaining_m: 4.5}</tspan></text>
  <text x="420" y="228" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#d29922">{remaining_m: 4.0}</text>
  <text x="420" y="258" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="12" fill="#d29922">...</text>
  <line x1="190" y1="300" x2="645" y2="300" stroke="#f85149" stroke-width="2" stroke-dasharray="8 4" marker-end="url(#a)"/>
  <text x="420" y="292" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="13" fill="#f85149">cancel (opcional, en cualquier momento)</text>
  <line x1="650" y1="340" x2="195" y2="340" stroke="#3fb950" stroke-width="2" marker-end="url(#a)"/>
  <text x="420" y="332" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="13" fill="#e6edf3">4. result <tspan font-family="ui-monospace, Consolas, monospace" fill="#3fb950">{traveled_m: ...}</tspan></text>
  <text x="420" y="375" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="13" fill="#e6edf3">Estado final, uno solo: <tspan font-family="ui-monospace, Consolas, monospace" fill="#3fb950">SUCCEEDED</tspan>  <tspan font-family="ui-monospace, Consolas, monospace" fill="#f85149">CANCELED</tspan>  <tspan font-family="ui-monospace, Consolas, monospace" fill="#d29922">ABORTED</tspan></text>
  <text x="420" y="402" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="12" fill="#8b949e">El server decide si acepta el goal y la cancelación, y marca el estado final</text>
</svg>
