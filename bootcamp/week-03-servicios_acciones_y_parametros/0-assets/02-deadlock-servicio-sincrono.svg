<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-label="Izquierda, llamada síncrona dentro de un callback: el executor ejecuta el callback, el callback espera la response y la response espera al executor; ciclo cerrado. Derecha, llamada asíncrona: el callback envía la request y termina, el executor queda libre y entrega la response">
  <title>call() bloquea, call_async() no</title>
  <defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker></defs>
  <rect width="840" height="360" fill="#0d1117"/>
  <text x="210" y="36" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="16" font-weight="700" fill="#f85149">call() dentro de un callback</text>
  <text x="630" y="36" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="16" font-weight="700" fill="#3fb950">call_async()</text>
  <line x1="420" y1="20" x2="420" y2="340" stroke="#30363d" stroke-width="2"/>
  <rect x="120" y="60" width="180" height="50" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="210" y="90" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="14" fill="#e6edf3">executor (1 hilo)</text>
  <rect x="30" y="200" width="160" height="50" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="110" y="230" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="14" fill="#e6edf3">callback</text>
  <rect x="230" y="200" width="160" height="50" rx="8" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="310" y="230" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="14" fill="#e6edf3">response</text>
  <line x1="170" y1="112" x2="115" y2="196" stroke="#f85149" stroke-width="2" marker-end="url(#r)"/>
  <text x="40" y="160" font-family="Inter, Roboto, sans-serif" font-size="12" fill="#8b949e">lo está ejecutando</text>
  <line x1="194" y1="225" x2="226" y2="225" stroke="#f85149" stroke-width="2" marker-end="url(#r)"/>
  <text x="210" y="275" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="12" fill="#8b949e">espera la response</text>
  <line x1="305" y1="196" x2="250" y2="114" stroke="#f85149" stroke-width="2" marker-end="url(#r)"/>
  <text x="290" y="160" font-family="Inter, Roboto, sans-serif" font-size="12" fill="#8b949e">solo la entrega el executor</text>
  <text x="210" y="320" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="14" font-weight="700" fill="#f85149">Ciclo cerrado: el nodo se congela</text>
  <rect x="540" y="60" width="180" height="50" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="630" y="90" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="14" fill="#e6edf3">callback</text>
  <rect x="540" y="150" width="180" height="50" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="630" y="173" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="14" fill="#e6edf3">termina enseguida</text>
  <text x="630" y="191" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#8b949e">devuelve un Future</text>
  <rect x="540" y="240" width="180" height="50" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="630" y="263" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="14" fill="#e6edf3">executor libre</text>
  <text x="630" y="281" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#8b949e">completa el Future</text>
  <line x1="630" y1="112" x2="630" y2="146" stroke="#3fb950" stroke-width="2" marker-end="url(#g)"/>
  <line x1="630" y1="202" x2="630" y2="236" stroke="#3fb950" stroke-width="2" marker-end="url(#g)"/>
  <text x="630" y="320" text-anchor="middle" font-family="Inter, Roboto, sans-serif" font-size="14" font-weight="700" fill="#3fb950">Sin ciclo: la response llega</text>
</svg>
