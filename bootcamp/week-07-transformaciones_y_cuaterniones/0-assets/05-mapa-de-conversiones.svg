<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-label="Mapa de conversiones de tf_transformations. Ángulos de Euler a cuaternión con quaternion_from_euler y vuelta con euler_from_quaternion. Cuaternión a matriz 4x4 con quaternion_matrix y vuelta con quaternion_from_matrix. Euler a matriz con euler_matrix y vuelta con euler_from_matrix. Las matrices se encadenan con concatenate_matrices e inverse_matrix. Abajo, tf2: un PointStamped en laser_link pasa a odom con buffer.transform, que usa las transformaciones de /tf y /tf_static">
  <title>Mapa de conversiones</title>
  <style>text{font-family:Inter,Roboto,"Segoe UI",system-ui,sans-serif;fill:#e6edf3;font-size:13px}.m{font-family:ui-monospace,"JetBrains Mono",Consolas,monospace;fill:#79c0ff;font-size:12px}.s{fill:#8b949e;font-size:12px}.t{font-size:18px;font-weight:700}.h{font-size:14px;font-weight:700}.r{fill:#f85149}.g{fill:#3fb950}.b{fill:#4b8bbe}.o{fill:#d29922}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b8bbe"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d29922"/></marker></defs>
  <rect width="860" height="400" fill="#0d1117"/>
  <text x="430" y="34" text-anchor="middle" class="t">Tres formas de la misma orientación</text>
  <g text-anchor="middle">
    <rect x="40" y="70" width="210" height="70" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="145" y="98" class="h">Ángulos de Euler</text><text x="145" y="120" class="m">(roll, pitch, yaw)</text>
    <rect x="610" y="70" width="210" height="70" rx="10" fill="#161b22" stroke="#4b8bbe" stroke-width="2"/>
    <text x="715" y="98" class="h">Cuaternión</text><text x="715" y="120" class="m">(x, y, z, w)</text>
    <rect x="325" y="190" width="210" height="70" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="430" y="218" class="h">Matriz 4x4</text><text x="430" y="240" class="m">rotación + traslación</text>
  </g>
  <line x1="254" y1="96" x2="604" y2="96" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="604" y1="116" x2="254" y2="116" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="430" y="88" text-anchor="middle" class="m">quaternion_from_euler</text>
  <text x="430" y="134" text-anchor="middle" class="m">euler_from_quaternion</text>
  <line x1="140" y1="144" x2="320" y2="210" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="320" y1="236" x2="110" y2="150" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="60" y="246" class="m">euler_matrix</text><text x="60" y="262" class="m">euler_from_matrix</text>
  <line x1="720" y1="144" x2="540" y2="210" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="540" y1="236" x2="750" y2="150" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="600" y="246" class="m">quaternion_matrix</text><text x="600" y="262" class="m">quaternion_from_matrix</text>
  <text x="430" y="290" text-anchor="middle" class="s">entre matrices: concatenate_matrices · inverse_matrix · translation_matrix</text>
  <rect x="40" y="304" width="780" height="76" rx="10" fill="#21262d" stroke="#30363d" stroke-width="2"/>
  <text x="58" y="330" class="h">tf2: cuando los datos llegan por /tf y /tf_static</text>
  <text x="58" y="354" class="m">buffer.transform(PointStamped en laser_link, "odom")</text>
  <text x="58" y="372" class="s">busca la transformación del instante del mensaje y la aplica · necesita import tf2_geometry_msgs</text>
</svg>
