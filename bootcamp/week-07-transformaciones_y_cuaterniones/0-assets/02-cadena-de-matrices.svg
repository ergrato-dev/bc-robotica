<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-label="Cadena odom, base_link, laser_link. T_odom_base tiene la rotación de 90 grados en yaw y la traslación (2, 0, 0). T_base_laser no gira y traslada 0.20 en x. Su producto T_odom_laser tiene la misma rotación y la traslación (2, 0.2, 0). Los subíndices de dentro se tocan y se cancelan. El punto (1, 0, 0, 1) visto por el láser queda en (2, 1.2, 0, 1) en odom">
  <title>Cadena de matrices homogéneas</title>
  <style>text{font-family:Inter,Roboto,"Segoe UI",system-ui,sans-serif;fill:#e6edf3;font-size:13px}.m{font-family:ui-monospace,"JetBrains Mono",Consolas,monospace;fill:#79c0ff;font-size:12px}.s{fill:#8b949e;font-size:12px}.t{font-size:18px;font-weight:700}.h{font-size:14px;font-weight:700}.r{fill:#f85149}.g{fill:#3fb950}.b{fill:#4b8bbe}.o{fill:#d29922}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b8bbe"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d29922"/></marker></defs>
  <rect width="860" height="400" fill="#0d1117"/>
  <text x="430" y="34" text-anchor="middle" class="t">Encadenar marcos es multiplicar sus matrices 4x4</text>
  <g text-anchor="middle">
    <rect x="60" y="60" width="150" height="44" rx="10" fill="#161b22" stroke="#e6edf3" stroke-width="2"/><text x="135" y="87" class="h">odom</text>
    <rect x="355" y="60" width="150" height="44" rx="10" fill="#161b22" stroke="#4b8bbe" stroke-width="2"/><text x="430" y="87" class="h">base_link</text>
    <rect x="650" y="60" width="150" height="44" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="725" y="87" class="h">laser_link</text>
  </g>
  <line x1="214" y1="82" x2="350" y2="82" stroke="#4b8bbe" stroke-width="3" marker-end="url(#mb)"/>
  <line x1="509" y1="82" x2="645" y2="82" stroke="#3fb950" stroke-width="3" marker-end="url(#mg)"/>
  <text x="282" y="72" text-anchor="middle" class="s">yaw 90°, x 2.0</text>
  <text x="577" y="72" text-anchor="middle" class="s">x 0.20</text>
  <g class="m" style="font-size:13px">
    <text x="40" y="150" class="h b">T_odom_base</text>
    <text x="52" y="176" text-anchor="end">0</text><text x="86" y="176" text-anchor="end">−1</text><text x="120" y="176" text-anchor="end">0</text><text x="154" y="176" text-anchor="end">2</text><text x="52" y="196" text-anchor="end">1</text><text x="86" y="196" text-anchor="end">0</text><text x="120" y="196" text-anchor="end">0</text><text x="154" y="196" text-anchor="end">0</text><text x="52" y="216" text-anchor="end">0</text><text x="86" y="216" text-anchor="end">0</text><text x="120" y="216" text-anchor="end">1</text><text x="154" y="216" text-anchor="end">0</text><text x="52" y="236" text-anchor="end">0</text><text x="86" y="236" text-anchor="end">0</text><text x="120" y="236" text-anchor="end">0</text><text x="154" y="236" text-anchor="end">1</text>
    <text x="215" y="200" class="h" style="font-size:20px">@</text>
    <text x="250" y="150" class="h g">T_base_laser</text>
    <text x="262" y="176" text-anchor="end">1</text><text x="296" y="176" text-anchor="end">0</text><text x="330" y="176" text-anchor="end">0</text><text x="364" y="176" text-anchor="end">0.2</text><text x="262" y="196" text-anchor="end">0</text><text x="296" y="196" text-anchor="end">1</text><text x="330" y="196" text-anchor="end">0</text><text x="364" y="196" text-anchor="end">0</text><text x="262" y="216" text-anchor="end">0</text><text x="296" y="216" text-anchor="end">0</text><text x="330" y="216" text-anchor="end">1</text><text x="364" y="216" text-anchor="end">0</text><text x="262" y="236" text-anchor="end">0</text><text x="296" y="236" text-anchor="end">0</text><text x="330" y="236" text-anchor="end">0</text><text x="364" y="236" text-anchor="end">1</text>
    <text x="440" y="200" class="h" style="font-size:20px">=</text>
    <text x="475" y="150" class="h o">T_odom_laser</text>
    <text x="487" y="176" text-anchor="end">0</text><text x="521" y="176" text-anchor="end">−1</text><text x="555" y="176" text-anchor="end">0</text><text x="589" y="176" text-anchor="end">2</text><text x="487" y="196" text-anchor="end">1</text><text x="521" y="196" text-anchor="end">0</text><text x="555" y="196" text-anchor="end">0</text><text x="589" y="196" text-anchor="end">0.2</text><text x="487" y="216" text-anchor="end">0</text><text x="521" y="216" text-anchor="end">0</text><text x="555" y="216" text-anchor="end">1</text><text x="589" y="216" text-anchor="end">0</text><text x="487" y="236" text-anchor="end">0</text><text x="521" y="236" text-anchor="end">0</text><text x="555" y="236" text-anchor="end">0</text><text x="589" y="236" text-anchor="end">1</text>
  </g>
  <rect x="640" y="132" width="200" height="118" rx="10" fill="#21262d" stroke="#d29922" stroke-width="2"/>
  <text x="655" y="156" class="h">Fichas de dominó</text>
  <text x="655" y="180" class="m">odom_base · base_laser</text>
  <text x="655" y="200" class="s">los de dentro se tocan:</text>
  <text x="655" y="220" class="m">= odom_laser</text>
  <text x="655" y="240" class="s">si no se tocan, está mal</text>
  <rect x="40" y="280" width="800" height="96" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="60" y="306" class="h">Un punto visto por el láser, escrito en odom</text>
  <text x="60" y="332" class="m" style="font-size:14px">T_odom_laser @ (1, 0, 0, 1) = (2, 1.2, 0, 1)</text>
  <text x="60" y="356" class="s">el 1 final recoge la traslación; una dirección lleva un 0 y solo gira: T_odom_laser @ (1, 0, 0, 0) = (0, 1, 0, 0)</text>
</svg>
