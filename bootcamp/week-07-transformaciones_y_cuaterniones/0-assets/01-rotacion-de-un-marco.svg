<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" aria-label="Un marco b girado un ángulo theta respecto a su padre a. El eje x de b apunta a (cos theta, sin theta) y su eje y a (menos sin theta, cos theta), escritos en a. Esos dos vectores son las columnas de la matriz de rotación R_a_b. Un punto p tiene coordenadas (1.0, 0.4) en b y (0.59, 0.90) en a, con theta de 35 grados: el punto es el mismo, cambia el marco en el que se escribe">
  <title>Rotación de un marco</title>
  <style>text{font-family:Inter,Roboto,"Segoe UI",system-ui,sans-serif;fill:#e6edf3;font-size:13px}.m{font-family:ui-monospace,"JetBrains Mono",Consolas,monospace;fill:#79c0ff;font-size:12px}.s{fill:#8b949e;font-size:12px}.t{font-size:18px;font-weight:700}.h{font-size:14px;font-weight:700}.r{fill:#f85149}.g{fill:#3fb950}.b{fill:#4b8bbe}.o{fill:#d29922}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b8bbe"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f85149"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d29922"/></marker></defs>
  <rect width="860" height="380" fill="#0d1117"/>
  <text x="430" y="34" text-anchor="middle" class="t">Las columnas de R son los ejes del hijo vistos desde el padre</text>
  <line x1="200" y1="300" x2="390" y2="300" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <line x1="200" y1="300" x2="200" y2="110" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="396" y="304" class="s">x de a</text><text x="208" y="112" class="s">y de a</text>
  <line x1="200" y1="300" x2="347" y2="197" stroke="#4b8bbe" stroke-width="3" marker-end="url(#mb)"/>
  <line x1="200" y1="300" x2="97" y2="153" stroke="#3fb950" stroke-width="3" marker-end="url(#mg)"/>
  <text x="356" y="204" class="h b">x de b</text><text x="356" y="221" class="m">(cos θ, sin θ)</text>
  <text x="40" y="146" class="h g">y de b</text><text x="20" y="128" class="m">(−sin θ, cos θ)</text>
  <path d="M262 300 A62 62 0 0 0 251 265" fill="none" stroke="#d29922" stroke-width="2"/>
  <text x="270" y="288" class="h o">θ</text>
  <circle cx="288" cy="165" r="6" fill="#d29922"/>
  <line x1="200" y1="300" x2="284" y2="171" stroke="#d29922" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="298" y="128" class="h">p</text>
  <text x="298" y="146" class="s">(1.0, 0.4) en b</text>
  <text x="298" y="162" class="s">(0.59, 0.90) en a</text>
  <text x="200" y="330" text-anchor="middle" class="s">origen común: solo hay giro</text>
  <rect x="470" y="80" width="370" height="270" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="490" y="110" class="h">R_a_b, con θ = 35°</text>
  <text x="490" y="150" class="m" style="font-size:15px">R_a_b =</text>
  <text x="580" y="140" class="m b" style="font-size:15px">cos θ</text><text x="680" y="140" class="m g" style="font-size:15px">−sin θ</text>
  <text x="580" y="166" class="m b" style="font-size:15px">sin θ</text><text x="680" y="166" class="m g" style="font-size:15px"> cos θ</text>
  <path d="M570 124 L564 124 L564 174 L570 174 M752 124 L758 124 L758 174 L752 174" fill="none" stroke="#e6edf3" stroke-width="1.5"/>
  <text x="606" y="194" class="s" text-anchor="middle">columna 1</text><text x="606" y="210" class="s b" text-anchor="middle">x de b</text>
  <text x="712" y="194" class="s" text-anchor="middle">columna 2</text><text x="712" y="210" class="s g" text-anchor="middle">y de b</text>
  <text x="490" y="232" class="m">p_a = R_a_b @ p_b</text>
  <text x="490" y="254" class="s">lleva las coordenadas de p en b a las de p en a</text>
  <text x="490" y="290" class="m">R_b_a = R_a_bᵀ</text>
  <text x="490" y="312" class="s">deshacer un giro es trasponer la matriz</text>
  <text x="490" y="330" class="s">Rᵀ R = I  ·  det R = 1</text>
</svg>
