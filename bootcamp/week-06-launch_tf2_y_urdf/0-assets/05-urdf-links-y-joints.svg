<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-label="Arriba, el árbol del rover del Ejercicio 03: base_link tiene cuatro hijos; laser_link y caster_link por joints fixed, y left_wheel_link y right_wheel_link por joints continuous con eje 0 1 0. Abajo, el flujo: rover.urdf.xacro pasa por xacro y sale el URDF; robot_state_publisher lo recibe en el parámetro robot_description, junto con /joint_states que publica joint_state_publisher, y publica los joints fixed en /tf_static y los móviles en /tf">
  <title>Links, joints y robot_state_publisher</title>
  <style>text{font-family:Inter,Roboto,"Segoe UI",system-ui,sans-serif;fill:#e6edf3;font-size:13px}.m{font-family:ui-monospace,"JetBrains Mono",Consolas,monospace;fill:#79c0ff;font-size:12px}.s{fill:#8b949e;font-size:12px}.t{font-size:18px;font-weight:700}.h{font-size:14px;font-weight:700}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/></marker><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d29922"/></marker></defs>
  <rect width="860" height="400" fill="#0d1117"/>
  <text x="430" y="32" text-anchor="middle" class="t">El modelo: links unidos por joints</text>
  <g text-anchor="middle">
    <rect x="350" y="50" width="160" height="44" rx="10" fill="#161b22" stroke="#e6edf3" stroke-width="2"/><text x="430" y="77" class="h">base_link</text>
    <rect x="20" y="150" width="180" height="44" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="110" y="177" class="h">laser_link</text>
    <rect x="230" y="150" width="180" height="44" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="320" y="177" class="h">caster_link</text>
    <rect x="450" y="150" width="180" height="44" rx="10" fill="#161b22" stroke="#4b8bbe" stroke-width="2"/><text x="540" y="177" class="h">left_wheel_link</text>
    <rect x="660" y="150" width="180" height="44" rx="10" fill="#161b22" stroke="#4b8bbe" stroke-width="2"/><text x="750" y="177" class="h">right_wheel_link</text>
  </g>
  <g stroke-width="2">
    <line x1="380" y1="94" x2="120" y2="146" stroke="#3fb950" stroke-dasharray="6 4" marker-end="url(#a)"/>
    <line x1="410" y1="94" x2="330" y2="146" stroke="#3fb950" stroke-dasharray="6 4" marker-end="url(#a)"/>
    <line x1="450" y1="94" x2="530" y2="146" stroke="#4b8bbe" marker-end="url(#a)"/>
    <line x1="480" y1="94" x2="740" y2="146" stroke="#4b8bbe" marker-end="url(#a)"/>
  </g>
  <text x="335" y="76" text-anchor="end" class="m">joints fixed</text>
  <text x="525" y="76" class="m">joints continuous · axis 0 1 0</text>
  <line x1="20" y1="222" x2="840" y2="222" stroke="#30363d"/>
  <rect x="20" y="250" width="135" height="56" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="87" y="274" text-anchor="middle" class="m">rover.urdf.xacro</text><text x="87" y="294" text-anchor="middle" class="s">propiedades, macros</text>
  <line x1="155" y1="278" x2="196" y2="278" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="176" y="268" text-anchor="middle" class="s">xacro</text>
  <rect x="200" y="250" width="95" height="56" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="247" y="274" text-anchor="middle" class="m">URDF</text><text x="247" y="294" text-anchor="middle" class="s">check_urdf</text>
  <line x1="295" y1="278" x2="436" y2="278" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="365" y="268" text-anchor="middle" class="m">robot_description</text>
  <rect x="440" y="246" width="200" height="64" rx="10" fill="#161b22" stroke="#00599c" stroke-width="2"/>
  <text x="540" y="273" text-anchor="middle" class="h">robot_state_</text><text x="540" y="293" text-anchor="middle" class="h">publisher</text>
  <rect x="440" y="340" width="200" height="44" rx="10" fill="#161b22" stroke="#4b8bbe" stroke-width="2"/>
  <text x="540" y="367" text-anchor="middle" class="h">joint_state_publisher</text>
  <line x1="540" y1="340" x2="540" y2="314" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>
  <text x="550" y="330" class="m">/joint_states</text>
  <line x1="640" y1="262" x2="706" y2="252" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <line x1="640" y1="294" x2="706" y2="306" stroke="#4b8bbe" stroke-width="2" marker-end="url(#a)"/>
  <text x="712" y="256" class="m">/tf_static</text><text x="712" y="272" class="s">joints fixed, una vez</text>
  <text x="712" y="310" class="m">/tf</text><text x="712" y="326" class="s">joints móviles, con</text><text x="712" y="342" class="s">cada /joint_states</text>
</svg>
